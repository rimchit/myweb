<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual kiyim kiyish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    max-width: 520px; margin: 0 auto;
  }
  h1 { font-size: 20px; font-weight: 650; margin-bottom: 4px; }
  p.sub { color: var(--hint); font-size: 14px; margin-bottom: 16px; line-height: 1.4; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .slot {
    position: relative; aspect-ratio: 3 / 4; border-radius: 14px; background: var(--card);
    overflow: hidden; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 6px; text-align: center; color: var(--hint);
    font-size: 14px; cursor: pointer; border: 2px dashed transparent;
  }
  .slot.empty { border-color: var(--hint); }
  .slot strong { color: var(--text); font-size: 15px; }
  .slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .slot input { display: none; }
  button {
    width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px;
    background: var(--btn); color: var(--btn-text); font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .45; }
  #status { margin-top: 16px; text-align: center; color: var(--hint); font-size: 14px; min-height: 20px; }
  #status.err { color: #d93025; }
  @media (prefers-reduced-motion: no-preference) {
    .spin { display: inline-block; animation: s 1.2s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  }
</style>
</head>
<body>
  <h1>Virtual kiyim kiyish</h1>
  <p class="sub">Kiyim va o'zingizning rasmingizni tanlang, yuboring, natija tayyor bo'lgach chatga keladi.</p>

  <div class="slots">
    <label class="slot empty" id="slotCloth"><strong>Kiyim</strong><span>Rasm tanlash</span>
      <input type="file" accept="image/*" id="fileCloth"></label>
    <label class="slot empty" id="slotPerson"><strong>Siz</strong><span>Rasm tanlash</span>
      <input type="file" accept="image/*" id="filePerson"></label>
  </div>

  <button id="go" disabled>Yuborish</button>
  <div id="status"></div>

<script>
// ---- Sozlamalar -----------------------------------------------------------
const BASE_URL = "https://weshopai-weshopai-virtual-try-on.hf.space";
// Zaxira qiymatlar: odatda /config'dan avtomatik aniqlanadi (detectEndpoint)
const FALLBACK_FN_INDEX = 2;
const FALLBACK_TRIGGER_ID = 18;
const MAX_SIDE = 768;

const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const $ = (id) => document.getElementById(id);
const files = { cloth: null, person: null };
let endpoint = null;

// Tarmoq xatosi (fetch TypeError) boshqa JS xatolaridan ajratib olinadi
class NetError extends Error {}
async function req(url, opts) {
  try { return await fetch(url, opts); }
  catch (e) { throw new NetError("network"); }
}

// ---- Rasm tanlash ---------------------------------------------------------
function setSlot(key, file) {
  const slot = $(key === "cloth" ? "slotCloth" : "slotPerson");
  slot.querySelector("img")?.remove();
  files[key] = file;
  if (file) {
    slot.classList.remove("empty");
    const img = document.createElement("img");
    img.src = URL.createObjectURL(file);
    slot.appendChild(img);
  } else {
    slot.classList.add("empty");
  }
  $("go").disabled = !(files.cloth && files.person);
}
function bindSlot(key, inputId) {
  $(inputId).addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) setSlot(key, f);
  });
}
bindSlot("cloth", "fileCloth");
bindSlot("person", "filePerson");

// ---- Yordamchi funksiyalar -----------------------------------------------
let tick = null, t0 = 0, baseText = "";
function render() {
  const sec = Math.round((Date.now() - t0) / 1000);
  $("status").innerHTML = `${baseText} <small>· ${sec} soniya</small>`;
}
function setStatus(text, isError = false) {
  clearInterval(tick); tick = null;
  const el = $("status");
  el.className = isError ? "err" : "";
  el.innerHTML = text;
}
function setProgress(text) {   // vaqt hisoblagichli holat
  if (!tick) { t0 = Date.now(); tick = setInterval(render, 1000); }
  $("status").className = "";
  baseText = text; render();
}

async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k);
  c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob(res, "image/jpeg", 0.92));
}

// Space yangilanib fn_index / trigger_id o'zgargan bo'lsa, ularni /config'dan topamiz
async function detectEndpoint() {
  if (endpoint) return endpoint;
  endpoint = { fn: FALLBACK_FN_INDEX, trigger: FALLBACK_TRIGGER_ID };
  try {
    const r = await req(`${BASE_URL}/config`);
    if (!r.ok) throw new Error("config " + r.status);
    const deps = (await r.json()).dependencies || [];
    const fits = (d) => Array.isArray(d.inputs) && d.inputs.length === 3 && d.targets?.length;
    const dep = deps.find((d) => d.id === FALLBACK_FN_INDEX && fits(d)) || deps.find(fits);
    if (dep) {
      endpoint = { fn: dep.id, trigger: dep.targets[0][0] };
      if (dep.id !== FALLBACK_FN_INDEX || endpoint.trigger !== FALLBACK_TRIGGER_ID) {
        console.warn("Space o'zgargan, yangi qiymatlar:", endpoint);
      }
    }
  } catch (e) {
    console.warn("Endpoint aniqlanmadi, zaxira qiymatlar ishlatiladi", e);
  }
  return endpoint;
}

async function upload(blob, name) {
  const form = new FormData();
  form.append("files", blob, name);
  const r = await req(`${BASE_URL}/gradio_api/upload`, { method: "POST", body: form });
  if (!r.ok) throw new Error(`Yuklashda xatolik: ${r.status}`);
  const path = (await r.json())[0];
  return {
    path, url: `${BASE_URL}/gradio_api/file=${path}`,
    orig_name: name, meta: { _type: "gradio.FileData" },
  };
}

async function joinQueue(cloth, person, hash) {
  const ep = await detectEndpoint();
  const r = await req(`${BASE_URL}/gradio_api/queue/join`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      data: [cloth, person, null], event_data: null,
      fn_index: ep.fn, trigger_id: ep.trigger, session_hash: hash,
    }),
  });
  if (!r.ok) {
    const hint = (r.status === 404 || r.status === 422)
      ? " (xizmat o'zgargan bo'lishi mumkin, keyinroq urinib ko'ring)" : "";
    throw new Error(`Navbatga qo'shilishda xatolik: ${r.status}${hint}`);
  }
}

// ---- Asosiy oqim ---------------------------------------------------------
$("go").addEventListener("click", async () => {
  $("go").disabled = true;
  const hash = crypto.randomUUID().replace(/-/g, "");
  let sent = false;
  try {
    setProgress(`<span class="spin">⏳</span> Rasmlar yuklanmoqda…`);
    const [cb, pb] = await Promise.all([shrink(files.cloth), shrink(files.person)]);
    const [cloth, person] = await Promise.all([upload(cb, "cloth.jpg"), upload(pb, "person.jpg")]);

    setProgress(`<span class="spin">⏳</span> Navbatga qo'shilmoqda…`);
    await joinQueue(cloth, person, hash);

    setStatus("✅ Yuborildi! Natija chatga keladi.");
    tg.HapticFeedback?.notificationOccurred("success");
    sent = true;
    // Mini App yopiladi, natijani bot o'zi kutib olib chatga yuboradi
    setTimeout(() => tg.sendData(JSON.stringify({ hash })), 500);
  } catch (e) {
    const msg = e instanceof NetError
      ? "Serverga ulanib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring."
      : e.message;
    setStatus(msg, true);
    tg.HapticFeedback?.notificationOccurred("error");
    console.error(e);
  } finally {
    if (!sent) $("go").disabled = !(files.cloth && files.person);
  }
});
</script>
</body>
</html>
